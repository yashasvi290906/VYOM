# VYOM Production Nginx Reverse Proxy Configuration (F10, F09)
# Terminates TLS and forwards traffic to the Express API Gateway (127.0.0.1:3000)
# Spring Boot (127.0.0.1:8080) is bound to localhost and MUST NOT be exposed to the WAN.

upstream vyom_gateway {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name vyom.internal pay.vyom.internal;

    # Let's Encrypt ACME challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vyom.internal pay.vyom.internal;

    # SSL/TLS Certificates
    ssl_certificate /etc/ssl/certs/vyom.crt;
    ssl_certificate_key /etc/ssl/private/vyom.key;

    # Strong TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # HSTS - HTTP Strict Transport Security
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size for financial payloads
    client_max_body_size 5M;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Logging
    access_log /var/log/nginx/vyom_access.log combined;
    error_log /var/log/nginx/vyom_error.log warn;

    location / {
        proxy_pass http://vyom_gateway;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        # Connection Keep-Alive
        proxy_set_header Connection "";

        # Timeouts for Gateway forwarding
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }
}
