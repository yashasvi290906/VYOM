spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${TEST_DB_NAME:payledger_test}?reWriteBatchedInserts=true
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 25
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: VyomTestHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true
        generate_statistics: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

vyom:
  jwt:
    secret: vyom-test-hmac-sha256-signing-secret-key-32-bytes-minimum
    expiration-minutes: 60
  admin:
    bootstrap:
      enabled: false
      email: ""
      password: ""
  idempotency:
    timeout-seconds: 120
    janitor:
      enabled: true
      interval-ms: 60000
      initial-delay-ms: 10000
  webhook:
    encryption:
      active-key-version: 1
      master-key: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
      keys:
        1: "MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="
    scheduler:
      enabled: false

logging:
  level:
    root: INFO
    com.vyom: DEBUG
