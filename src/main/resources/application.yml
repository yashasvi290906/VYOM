server:
  port: ${BACKEND_PORT:${SERVER_PORT:8080}}
  address: ${SERVER_ADDRESS:127.0.0.1}
  shutdown: graceful

spring:
  application:
    name: vyom-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payledger}?reWriteBatchedInserts=true
    username: ${DB_USER:${SPRING_DATASOURCE_USERNAME:postgres}}
    password: ${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: VyomHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    clean-disabled: true
    user: ${DB_MIGRATION_USER:${FLYWAY_USER:${spring.datasource.username}}}
    password: ${DB_MIGRATION_PASSWORD:${FLYWAY_PASSWORD:${spring.datasource.password}}}

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

vyom:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  admin:
    bootstrap:
      enabled: ${VYOM_ADMIN_BOOTSTRAP_ENABLED:false}
      email: ${VYOM_ADMIN_BOOTSTRAP_EMAIL:}
      password: ${VYOM_ADMIN_BOOTSTRAP_PASSWORD:}
      full-name: ${VYOM_ADMIN_BOOTSTRAP_FULL_NAME:System Administrator}
  idempotency:
    timeout-seconds: ${IDEMPOTENCY_TIMEOUT_SECONDS:120}
    janitor:
      enabled: ${IDEMPOTENCY_JANITOR_ENABLED:true}
      interval-ms: ${IDEMPOTENCY_JANITOR_INTERVAL_MS:60000}
      initial-delay-ms: ${IDEMPOTENCY_JANITOR_INITIAL_DELAY_MS:10000}

logging:
  level:
    root: INFO
    com.vyom: ${LOG_LEVEL_VYOM:INFO}
    org.hibernate.SQL: WARN
